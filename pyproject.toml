[project]
name = "webflyx-rag-studio"
version = "1.0.0"
description = "Desktop multimodal RAG movie search application"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "keyring>=25.6,<26",
    "numpy>=2,<3",
    "openai>=2.44,<3",
    "pillow>=11,<13",
    "platformdirs>=4.3,<5",
    "pyside6>=6.8,<7",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=5,<7",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pyinstaller>=6.15",
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
