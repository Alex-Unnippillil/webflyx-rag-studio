name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      - run: uv run ruff check .

      - run: uv run pytest -q

      - run: uv run python scripts/make_icon.py

      - shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name WebflyxRAG `
            --icon assets/webflyx.ico `
            --collect-all sentence_transformers `
            --collect-all transformers `
            --collect-all keyring `
            desktop_app.py

      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release
          Compress-Archive `
            -Path dist\WebflyxRAG\* `
            -DestinationPath dist-release\Webflyx-RAG-Studio-portable-windows-x64.zip

      - shell: pwsh
        run: choco install innosetup -y --no-progress

      - shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\WebflyxRAG.iss

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/Webflyx-RAG-Studio-portable-windows-x64.zip
            dist-installer/Webflyx-RAG-Studio-Setup.exe
