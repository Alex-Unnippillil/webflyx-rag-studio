name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: uv sync --all-groups

      - run: uv run ruff check .

      - run: uv run pytest -q

      - run: uv run python scripts/make_icon.py

      - shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name WebflyxRAG `
            --icon assets/webflyx.ico `
            --collect-all sentence_transformers `
            --collect-all transformers `
            --collect-all keyring `
            desktop_app.py

          if (-not (Test-Path "dist\WebflyxRAG\WebflyxRAG.exe")) {
            throw "PyInstaller did not produce WebflyxRAG.exe"
          }

      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Compress-Archive `
            -Path dist\WebflyxRAG\* `
            -DestinationPath dist-release\Webflyx-RAG-Studio-portable-windows-x64.zip

      - shell: pwsh
        run: choco install innosetup -y --no-progress

      - shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $iscc) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found after installation."
          }

          & $iscc packaging\WebflyxRAG.iss

          if (-not (Test-Path "dist-installer\Webflyx-RAG-Studio-Setup.exe")) {
            throw "Inno Setup did not produce the expected installer."
          }

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist-release/Webflyx-RAG-Studio-portable-windows-x64.zip
            dist-installer/Webflyx-RAG-Studio-Setup.exe
